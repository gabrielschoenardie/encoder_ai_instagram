[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-encoder-ai"
dynamic = ["version"]
description = "Instagram Reels Encoder — Cineon Film Emulation Edition"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ffmpeg", "instagram", "reels", "video", "encoder", "cineon", "film-emulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2,<3",
    "numpy>=1.24.0",
    "av>=11.0.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "colour-science>=0.4.7",
    "pymediainfo>=1.0.0",
    "scipy>=1.10",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
opencv = ["opencv-python>=4.8.0"]
dev = ["pytest>=7", "pytest-timeout"]

[project.scripts]
reels-encoder = "Reels_Encoder_v2_FINAL:main"

[tool.setuptools]
py-modules = ["Reels_Encoder_v2_FINAL", "cineon_pipeline", "ebu_meter", "enhance_visualizer", "version"]
packages = ["ui", "enhance", "enhance.ai", "enhance.analyzers"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.setuptools.data-files]
"share/reels-encoder" = [
    "HollywoodCinema_Ultimate_v6.7B_1.5IRE_Instagram8bit_NeutralShadows.cube",
    "HollywoodCinema_Ultimate_v6.7B-W80_1.5IRE_Instagram8bit_NeutralShadows.cube",
    "HollywoodCinema_Ultimate_v6.8_3.1-96IRE_Instagram8bit_NeutralShadows.cube",
    "FilmLook_Portra400_SkinPriority_D65.cube",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# imports de probe: falham dentro de try/except ImportError para definir CINEON_AVAILABLE / ENHANCE_AVAILABLE / PYAV_AVAILABLE
"Reels_Encoder_v2_FINAL.py" = ["F401"]
# o import do projeto e o proprio teste de instalacao (testar_import_projeto)
"tools/verificador_instalacao.py" = ["F401"]
# `import version` e o smoke-check do modulo referenciado por [tool.setuptools.dynamic]
"ui/test_packaging.py" = ["F401"]
# imports do projeto so resolvem depois do sys.path.insert(_ROOT) que roda acima deles
"tools/gen_readme_assets.py" = ["E402"]
